name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Lint has known pre-existing errors (app/admin/page.tsx etc.).
      # Reported but not blocking until they are cleaned up; then remove continue-on-error.
      - name: Lint (non-blocking for now)
        run: npm run lint
        continue-on-error: true
